name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go · ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - pkg
          - gateway
          - services/members-service
          - services/booking-service
          - services/benefits-service
          - services/training-service
          - services/notification-worker
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        id: golangci_lint
        uses: golangci/golangci-lint-action@v8
        continue-on-error: true
        with:
          version: v2.1.6
          working-directory: ${{ matrix.module }}

      - name: golangci-lint (reintento)
        if: steps.golangci_lint.outcome == 'failure'
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          working-directory: ${{ matrix.module }}

      - name: go test (unitarios + integración con testcontainers)
        run: go test ./...

  web:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
