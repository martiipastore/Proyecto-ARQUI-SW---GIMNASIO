name: contract

on:
  pull_request:
    paths:
      - 'docs/contracts/**'
      - 'deploy/docker-compose.mock.yml'
      - '.github/workflows/contract.yml'
  push:
    branches: [main]
    paths:
      - 'docs/contracts/**'

jobs:
  lint:
    name: Lint del contrato (Spectral)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spectral
        run: make contract-lint

  mock-smoke:
    name: Mock (Prism) responde según el contrato
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Levantar mock
        run: make mock-up
      - name: Esperar a Prism
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:4010/v2/accounts/cli-10045/balance -H "X-API-Key: ci" && exit 0
            sleep 2
          done
          docker compose -f deploy/docker-compose.mock.yml logs
          exit 1
      - name: Ejemplos de la guía
        run: |
          set -euo pipefail
          BASE=http://localhost:4010
          check() { local expected=$1; shift; local got; got=$(curl -s -o /dev/null -w '%{http_code}' "$@"); echo "esperado $expected, obtenido $got: $*"; [ "$got" = "$expected" ]; }
          check 202 -X POST "$BASE/v2/external-register" -H "X-API-Key: ci" -H "Idempotency-Key: registro-ORDER-A-7781" -H "Content-Type: application/json" -d '{"name":"Persona de ejemplo","email":"persona@example.test","externalUserId":"cli-10045","eventId":"alta-ORDER-A-7781","points":0}'
          check 200 "$BASE/v2/external-registrations/alta-ORDER-A-7781" -H "X-API-Key: ci"
          check 201 -X POST "$BASE/v2/accounts/cli-10045/credits" -H "X-API-Key: ci" -H "Idempotency-Key: 9f1b6c2e-3a4d-4e5f-8a9b-0c1d2e3f4a5b" -H "Content-Type: application/json" -d '{"eventId":"ORDER-A-7781","points":150,"reason":"Compra en tienda online","reference":"ORDER-A-7781"}'
          check 200 "$BASE/v2/accounts/cli-10045/balance" -H "X-API-Key: ci"
          check 200 "$BASE/v2/accounts/cli-10045/movements?page=1&size=20" -H "X-API-Key: ci"
          check 401 "$BASE/v2/accounts/cli-10045/balance"
      - name: Bajar mock
        if: always()
        run: make mock-down
